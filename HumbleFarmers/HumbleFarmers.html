<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HFAA Generic Console</title>
    <link rel="icon" type="image/x-icon" href="images/pOtAtO.png" />
    <link rel="stylesheet" href="HumbleFarmers.css" />
    <script defer src="HumbleFarmers.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- Left Panel: Retro Console (25% width) -->
      <div class="console-panel">
        <div class="command-input-container">
          <input type="text" id="consoleCommand" placeholder="Enter command here..." />
          <button id="submitCommand">Enter</button>
        </div>
        <div id="consoleLog" class="console-log">
          <p>> System initializing...</p>
        </div>
      </div>
      <!-- Right Panel: Content Display (75% width) -->
      <div class="content-panel">
      </div>
    </div>
  </body>
</html>
